<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Editor — Legal</title>
  <meta name="description" content="Terms of Use and Privacy Policy for the PDF Editor app." />
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1c1f24;
      --muted: #5b6270;
      --accent: #2f6df6;
      --border: #e5e8ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e8eaed;
        --muted: #9aa2b1;
        --accent: #5b8cff;
        --border: #252a34;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
    p.sub { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 500;
      transition: border-color .15s ease;
    }
    a.btn:hover { border-color: var(--accent); }
    footer { color: var(--muted); font-size: 13px; margin-top: 28px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <h1>PDF Editor</h1>
    <p class="sub">Legal documents</p>
    <div class="links">
      <a class="btn" href="./terms.html">Terms of Use</a>
      <a class="btn" href="./privacy.html">Privacy Policy</a>
    </div>
    <footer>Contact: <a href="mailto:hanhnx96@gmail.com">hanhnx96@gmail.com</a></footer>
  </main>
</body>
</html>
